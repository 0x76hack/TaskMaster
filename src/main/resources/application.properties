spring.application.name=taskmaster

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/taskmasterdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=test
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate Properties
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# File Upload Configurations
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration (Security token)
# HS512 secret must be at least 64 bytes long
app.jwt.secret=9a4f2c8d3b7a1e5f8c6b2d4e7f9a0c1b3d5e2f8a6c7b9d0e1f3a5b7c9d0e2f4a6b8c0d2e4f6a8b0c2d4e6f8a0b2c4d6e8f0a2b4c6d8e0f2a4b6c8d0e2f4a6
app.jwt.expiration-ms=86400000

# File Upload Directory
app.upload.dir=./uploads
